[project]
name = "pixelclass-til-backend"
version = "0.1.0"
description = "Research backend for PixelClass TIL golden benchmark and evaluation pipeline"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.50",
    "pydantic>=2.7",
    "pytest>=8.0",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
